<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Buscaplay</title>
<style>
:root{--bg:#fbfaf7;--fg:#1f2430;--card:#fff;--mut:#6b7280;--acc:#e8590c;--ok:#2b8a3e;--bd:#e3dfd6;--bl:#1c7ed6;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14161b;--fg:#eceae4;--card:#212530;--mut:#9aa1af;--acc:#ff8f4a;--ok:#69db7c;--bd:#323846;--bl:#4dabf7;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14161b;--fg:#eceae4;--card:#212530;--mut:#9aa1af;--acc:#ff8f4a;--ok:#69db7c;--bd:#323846;--bl:#4dabf7;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.4}
main{max-width:720px;margin:0 auto;padding:28px 16px 48px}
.logo{font-size:2.6rem;text-align:center;margin:18px 0 6px;letter-spacing:-1px}
.logo span{color:var(--acc)}
.sub{text-align:center;color:var(--mut);margin:0 0 18px}
#q{width:100%;padding:14px 20px;font-size:1.05rem;border:1px solid var(--bd);border-radius:999px;background:var(--card);color:var(--fg);outline:none}
#q:focus{border-color:var(--acc)}
.chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:12px 0 18px}
.chips button{border:1px solid var(--bd);background:var(--card);color:var(--fg);border-radius:999px;padding:6px 12px;cursor:pointer}
#res{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.t{text-align:left;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;cursor:pointer;color:var(--fg);display:flex;flex-direction:column;gap:2px}
.t:hover{border-color:var(--acc)}
.t span{font-size:1.7rem}.t small{color:var(--mut)}
.back{border:0;background:none;color:var(--acc);font-size:1rem;cursor:pointer;padding:0 0 8px}
h2{margin:4px 0 12px}
.box{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.b{background:var(--acc);color:#fff;border:0;border-radius:10px;padding:9px 14px;font-size:1rem;cursor:pointer}
.b.g{background:var(--card);color:var(--fg);border:1px solid var(--bd)}
input,select,textarea{background:var(--bg);color:var(--fg);border:1px solid var(--bd);border-radius:8px;padding:8px;font-size:1rem;max-width:100%}
.n{width:84px}
canvas{width:100%;display:block;border:1px solid var(--bd);border-radius:12px;background:var(--bg);touch-action:none}
.hint{color:var(--mut);font-size:.9rem;margin:8px 0 0}
.out{font-size:1.3rem;margin-top:10px;word-break:break-word}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.c{aspect-ratio:1;border-radius:12px;border:1px solid var(--bd);background:var(--bg);font-size:2rem;display:flex;align-items:center;justify-content:center;cursor:pointer;user-select:none}
.c.f{background:var(--card)}
.pad{display:grid;grid-template-columns:repeat(3,56px);gap:6px;justify-content:center;margin-top:12px}
.pad button{height:48px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--fg);font-size:1.2rem}
.hist{display:flex;align-items:flex-end;gap:4px;height:140px;margin-top:10px}
.hist div{flex:1;background:var(--bl);border-radius:4px 4px 0 0;position:relative;min-height:2px}
.hist i{position:absolute;bottom:-18px;left:0;right:0;text-align:center;font-size:.75rem;font-style:normal;color:var(--mut)}
body{background-image:radial-gradient(circle at 8% 0%,color-mix(in srgb,var(--acc) 16%,transparent),transparent 42%),radial-gradient(circle at 95% 8%,color-mix(in srgb,var(--bl) 16%,transparent),transparent 42%);background-attachment:fixed}
@keyframes up{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
@keyframes bob{50%{transform:translateY(-6px) rotate(-6deg)}}
@keyframes br{0%{transform:scale(.6)}25%,50%{transform:scale(1)}75%,100%{transform:scale(.6)}}
@keyframes pop{50%{transform:scale(1.14)}}
@keyframes fall{to{transform:translate(var(--x),110vh) rotate(540deg);opacity:.5}}
.logo span{display:inline-block;animation:bob 2.4s ease-in-out infinite}
.logo{text-shadow:0 4px 18px color-mix(in srgb,var(--acc) 30%,transparent)}
#home:not([hidden]),#tool:not([hidden]){animation:up .35s both}
#q{box-shadow:0 6px 22px rgba(0,0,0,.07);transition:box-shadow .2s,border-color .2s,transform .2s}
#q:focus{transform:scale(1.02);box-shadow:0 8px 28px color-mix(in srgb,var(--acc) 28%,transparent)}
.chips button,.b,.pad button,.back{transition:transform .15s,box-shadow .15s,background .15s}
.chips button:hover,.b:hover{transform:translateY(-2px);box-shadow:0 5px 14px rgba(0,0,0,.15)}
.chips button:active,.b:active,.pad button:active,.c:active{transform:scale(.92)}
.t{transition:transform .2s,box-shadow .2s,border-color .2s;animation:up .45s both;animation-delay:calc(var(--i,0)*40ms)}
.t:hover{transform:translateY(-5px) rotate(-.6deg);box-shadow:0 10px 24px rgba(0,0,0,.14)}
.t span{width:54px;height:54px;display:grid;place-items:center;border-radius:15px;margin-bottom:6px;background:color-mix(in srgb,hsl(var(--h,20) 85% 60%) 24%,transparent);transition:transform .3s}
.t:hover span{transform:scale(1.18) rotate(-9deg)}
.box{animation:up .35s both}.c{transition:transform .15s,background .2s}.c.f{animation:pop .25s}
#tt{animation:up .3s both}
#mute,#musb{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:12px;z-index:5;padding:8px 11px;border-radius:999px}
.cf{position:fixed;top:-30px;z-index:99;pointer-events:none;animation:fall var(--d) ease-in forwards}
@keyframes hue{to{filter:hue-rotate(360deg)}}
@keyframes shake{0%{transform:translate(5px,-4px)}25%{transform:translate(-6px,5px)}50%{transform:translate(4px,6px)}75%{transform:translate(-5px,-5px)}100%{transform:translate(5px,-4px)}}
#musb{right:62px!important}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes zoomin{0%{transform:translate(-50%,-50%) scale(0) rotate(-25deg)}60%{transform:translate(-50%,-50%) scale(1.3) rotate(8deg)}100%{transform:translate(-50%,-50%) scale(1)}}
.ban{position:fixed;left:50%;top:40%;z-index:100;transform:translate(-50%,-50%);font-size:2.2rem;font-weight:800;text-align:center;color:#fff;text-shadow:0 0 20px #f0f,0 0 40px #0ff;background:rgba(0,0,0,.65);padding:20px 30px;border-radius:24px;animation:zoomin .8s both;pointer-events:none}
.ban small{font-size:1.1rem;display:block;margin-top:6px}
@keyframes rbw{to{background-position:200% 0}}
.rb .logo{width:fit-content;margin:18px auto 6px;background:linear-gradient(90deg,#f03e3e,#f59f00,#40c057,#228be6,#be4bdb,#f03e3e);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;text-shadow:none;animation:rbw 3s linear infinite}.rb .logo span{animation:none;display:inline;color:inherit;-webkit-text-fill-color:transparent}
.mp{font-style:normal;font-size:.75rem;background:var(--ok);color:#fff;border-radius:999px;padding:2px 8px;align-self:flex-start;margin-top:4px}
@media (prefers-reduced-motion:no-preference){.party main{animation:hue .8s linear infinite}.shk main{animation:shake .08s linear infinite}.party.shk main{animation:hue .8s linear infinite,shake .08s linear infinite}.party .t,.party .logo,.party .chips button{animation:spin 1.1s ease-in-out infinite!important}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main>
<button class="b g" id="mute" title="Som">🔊</button>
<button class="b g" id="musb" title="Música">🎵</button>
<div id="home">
<h1 class="logo">Busca<span>play</span></h1>
<p class="sub" id="gr"></p>
<input id="q" enterkeyhint="go" placeholder="Pesquisar… ex.: rede neural, cobrinha, função" autocomplete="off">
<div class="chips" id="chips"></div>
<div style="text-align:center;margin:-6px 0 18px"><button class="b" id="sur">🎲 Surpreenda-me!</button></div>
<div class="box" id="stats"></div>
<div id="res"></div>
</div>
<div id="tool" hidden><button class="back" id="back">← Voltar à busca</button><h2 id="tt"></h2><div id="tb"></div></div>
</main>
<script>
const $=s=>document.querySelector(s);
const get=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const set=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
const nm=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const cs=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();

/* ========== Calculadora gráfica ========== */
function graf(){
  const cv=$('#g'),c=cv.getContext('2d');let W=cv.width=cv.clientWidth,H=cv.height=320;
  let cx=0,cy=0,s=40;const col=['#e8590c','#1c7ed6','#2b8a3e'];
  const comp=t=>{if(!t.trim())return null;try{
    const e=t.replace(/\^/g,'**').replace(/(\d)\s*(x|\()/g,'$1*$2').replace(/\bln\b/g,'Math.log').replace(/\blog\b/g,'Math.log10')
    .replace(/\b(sin|cos|tan|asin|acos|atan|sqrt|abs|exp|floor|ceil|round)\b/g,'Math.$1').replace(/\bpi\b/gi,'Math.PI').replace(/\be\b/g,'Math.E');
    return new Function('x','return '+e)}catch(e){return null}};
  function draw(){
    c.clearRect(0,0,W,H);const fg=cs('--fg'),bd=cs('--bd');
    const st=[.1,.2,.5,1,2,5,10,20,50,100,200,500,1000].find(v=>v*s>=45)||1000;
    c.font='11px sans-serif';c.fillStyle=cs('--mut');c.lineWidth=1;
    for(let x=Math.ceil((cx-W/2/s)/st)*st;x<=cx+W/2/s;x+=st){const px=W/2+(x-cx)*s;c.strokeStyle=bd;c.beginPath();c.moveTo(px,0);c.lineTo(px,H);c.stroke();if(Math.abs(x)>1e-9)c.fillText(+x.toPrecision(3),px+2,H/2-cy*0+ (H/2+cy*s>H-4?H-4:Math.max(12,H/2+cy*s+12)))}
    for(let y=Math.ceil((cy-H/2/s)/st)*st;y<=cy+H/2/s;y+=st){const py=H/2-(y-cy)*s;c.strokeStyle=bd;c.beginPath();c.moveTo(0,py);c.lineTo(W,py);c.stroke();if(Math.abs(y)>1e-9)c.fillText(+y.toPrecision(3),4,py-2)}
    c.strokeStyle=fg;c.lineWidth=1.5;c.beginPath();c.moveTo(0,H/2+cy*s);c.lineTo(W,H/2+cy*s);c.moveTo(W/2-cx*s,0);c.lineTo(W/2-cx*s,H);c.stroke();
    document.querySelectorAll('.fi').forEach((inp,i)=>{
      const f=comp(inp.value);if(!f)return;c.strokeStyle=col[i];c.lineWidth=2.2;c.beginPath();let pen=false,last=0;
      for(let px=0;px<=W;px++){let y;try{y=f((px-W/2)/s+cx)}catch(e){y=NaN}
        const py=H/2-(y-cy)*s;
        if(!isFinite(py)||Math.abs(py-last)>H*3&&pen){pen=false;continue}
        pen?c.lineTo(px,py):c.moveTo(px,py);pen=true;last=py}
      c.stroke()});
  }
  document.querySelectorAll('.fi').forEach(i=>i.oninput=draw);
  $('#zi').onclick=()=>{s*=1.3;draw()};$('#zo').onclick=()=>{s/=1.3;draw()};
  $('#zr').onclick=()=>{cx=cy=0;s=40;draw()};
  let d=null;cv.onpointerdown=e=>{d=[e.clientX,e.clientY];cv.setPointerCapture(e.pointerId)};
  cv.onpointermove=e=>{if(!d)return;cx-=(e.clientX-d[0])*(W/cv.clientWidth)/s;cy+=(e.clientY-d[1])*(W/cv.clientWidth)/s;d=[e.clientX,e.clientY];draw()};
  cv.onpointerup=()=>d=null;
  cv.addEventListener('wheel',e=>{e.preventDefault();s*=e.deltaY<0?1.15:1/1.15;draw()},{passive:false});
  draw();return()=>{}
}

/* ========== Rede neural ========== */
function rede(){
  const cv=$('#nn'),c=cv.getContext('2d'),S=cv.width=cv.height=360,L=[2,10,10,1];
  let Wt,Bs,P,ep=0,run=false,raf;
  const mk=()=>{Wt=[];Bs=[];for(let i=0;i<3;i++){Wt[i]=Array.from({length:L[i+1]},()=>Array.from({length:L[i]},()=>(Math.random()-.5)*2*1.6/Math.sqrt(L[i])));Bs[i]=Array(L[i+1]).fill(0)}ep=0};
  const fwd=x=>{const a=[x];for(let i=0;i<3;i++){const p=a[i];a.push(Wt[i].map((w,j)=>{let s=Bs[i][j];for(let k=0;k<w.length;k++)s+=w[k]*p[k];return i<2?Math.tanh(s):1/(1+Math.exp(-s))}))}return a};
  const tr=(x,y,lr)=>{const a=fwd(x);let d=[a[3][0]-y];
    for(let i=2;i>=0;i--){const p=a[i],nd=Array(p.length).fill(0);
      for(let j=0;j<Wt[i].length;j++){for(let k=0;k<p.length;k++){nd[k]+=Wt[i][j][k]*d[j];Wt[i][j][k]-=lr*d[j]*p[k]}Bs[i][j]-=lr*d[j]}
      if(i>0)d=nd.map((v,k)=>v*(1-p[k]*p[k]))}};
  const data=k=>{const r=Math.random,o=[];for(let i=0;i<240;i++){let x=r()*2-1,y=r()*2-1,l;
    if(k==='xor')l=x*y>0?1:0;else if(k==='lin')l=x-y>.1?1:0;else if(k==='dia')l=Math.abs(x)+Math.abs(y)<.7?1:0;else if(k==='circ')l=Math.hypot(x,y)<.55?1:0;
    else{const t=r()*3.5+.4,s=i%2,a=t*1.8+s*Math.PI,q=t/4;x=Math.cos(a)*q+(r()-.5)*.08;y=Math.sin(a)*q+(r()-.5)*.08;l=s}
    o.push([x,y,l])}return o};
  function draw(){
    const g=36,z=S/g;
    for(let i=0;i<g;i++)for(let j=0;j<g;j++){const p=fwd([(i+.5)/g*2-1,1-(j+.5)/g*2])[3][0];
      c.fillStyle=`rgba(${28+204*p|0},${126-37*p|0},${214-202*p|0},.55)`;c.fillRect(i*z,j*z,z+1,z+1)}
    let ok=0;P.forEach(([x,y,l])=>{if((fwd([x,y])[3][0]>.5?1:0)===l)ok++;
      c.beginPath();c.arc((x+1)/2*S,(1-y)/2*S,4.5,0,7);c.fillStyle=l?'#e8590c':'#1c7ed6';c.fill();c.strokeStyle='#fff';c.lineWidth=1.5;c.stroke()});
    $('#ns').textContent=`Passos: ${ep} · Acerto: ${Math.round(ok/P.length*100)}%`}
  function loop(){if(run){for(let i=0;i<150;i++){const p=P[Math.random()*P.length|0];tr([p[0],p[1]],p[2],.05);ep++}}draw();raf=requestAnimationFrame(loop)}
  const reset=()=>{P=data($('#ds').value);mk()};
  $('#ds').onchange=reset;$('#nr').onclick=reset;
  $('#nt').onclick=()=>{run=!run;$('#nt').textContent=run?'⏸ Pausar':'▶ Treinar'};
  reset();loop();return()=>cancelAnimationFrame(raf)
}

/* ========== Aleatórios ========== */
function alea(){
  const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
  $('#rg').onclick=()=>{let a=+$('#r1').value,b=+$('#r2').value,q=Math.max(1,Math.min(200,+$('#r3').value||1));if(a>b)[a,b]=[b,a];
    const u=$('#r4').checked;if(u&&q>b-a+1)q=b-a+1;const o=[];while(o.length<q){const v=R(a,b);if(!u||!o.includes(v))o.push(v)}$('#ro').textContent=o.join(', ')};
  $('#sg').onclick=()=>{const l=$('#sl').value.split('\n').map(x=>x.trim()).filter(Boolean);$('#so').textContent=l.length?'🎉 '+l[R(0,l.length-1)]:'Adicione nomes, um por linha.'};
  $('#hg').onclick=()=>{const n=Array(11).fill(0);for(let i=0;i<1000;i++)n[R(1,6)+R(1,6)-2]++;const m=Math.max(...n);
    $('#hh').innerHTML=n.map((v,i)=>`<div style="height:${v/m*100}%" title="${v}"><i>${i+2}</i></div>`).join('')};
  $('#hg').click();return()=>{}
}

/* ========== Cobrinha ========== */
function cobra(){
  const cv=$('#cv'),c=cv.getContext('2d'),N=15,S=20;let sn,dir='r',nd='r',fd,sc,tm=null;$('#sb').textContent=get('snk')||0;
  const opp={u:'d',d:'u',l:'r',r:'l'},turn=d=>{if(d&&d!==opp[dir])nd=d};
  const food=()=>{do{fd={x:Math.random()*N|0,y:Math.random()*N|0}}while(sn.some(s=>s.x===fd.x&&s.y===fd.y))};
  const draw=()=>{c.clearRect(0,0,300,300);c.fillStyle=cs('--acc');c.beginPath();c.arc(fd.x*S+10,fd.y*S+10,7,0,7);c.fill();c.fillStyle=cs('--ok');sn.forEach(s=>c.fillRect(s.x*S+1,s.y*S+1,S-2,S-2))};
  const step=()=>{dir=nd;const h={x:sn[0].x+(dir==='r')-(dir==='l'),y:sn[0].y+(dir==='d')-(dir==='u')};
    if(h.x<0||h.y<0||h.x>=N||h.y>=N||sn.some(s=>s.x===h.x&&s.y===h.y)){snd('bad');earn(sc);clearInterval(tm);tm=null;if(sc>(+get('snk')||0)){set('snk',sc);$('#sb').textContent=sc}$('#ss').textContent='Jogar de novo';return}
    sn.unshift(h);if(h.x===fd.x&&h.y===fd.y){snd('ok');sc++;if(sc%4===0){clearInterval(tm);tm=setInterval(step,Math.max(60,(has('slow')?150:120)-sc*2))}$('#sp').textContent=sc;food()}else sn.pop();draw()};
  $('#ss').onclick=()=>{clearInterval(tm);sn=[{x:7,y:7},{x:6,y:7},{x:5,y:7}];dir=nd='r';sc=0;$('#sp').textContent=0;food();draw();tm=setInterval(step,has('slow')?150:120);$('#ss').textContent='Reiniciar'};
  document.querySelectorAll('.pad button').forEach(b=>b.onclick=()=>turn(b.dataset.d));
  const kd=e=>{const m={ArrowUp:'u',ArrowDown:'d',ArrowLeft:'l',ArrowRight:'r',w:'u',s:'d',a:'l',d:'r'}[e.key];if(m&&tm){e.preventDefault();turn(m)}};
  addEventListener('keydown',kd);let tx,ty;
  cv.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
  cv.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;if(Math.max(Math.abs(dx),Math.abs(dy))>20)turn(Math.abs(dx)>Math.abs(dy)?(dx>0?'r':'l'):(dy>0?'d':'u'))});
  sn=[{x:7,y:7}];fd={x:10,y:7};draw();
  return()=>{clearInterval(tm);removeEventListener('keydown',kd)}
}

/* ========== Memória ========== */
function memo(){
  let a=null,lock=false,m=0,p=0;
  const init=()=>{const e=['🍕','🚀','🐙','🌵','🎸','🦊','🍩','🌈'],d=[...e,...e].sort(()=>Math.random()-.5);a=null;lock=false;m=p=0;$('#mm').textContent=0;$('#mb').textContent=get('mem')||'–';$('#mg').innerHTML='';
    d.forEach(v=>{const k=document.createElement('div');k.className='c';k.onclick=()=>{if(lock||k.classList.contains('f'))return;k.classList.add('f');k.textContent=v;
      if(!a){a=k;a.dataset.v=v;return}m++;$('#mm').textContent=m;
      if(a.textContent===v){snd('ok');a=null;if(++p===8){if(m<(+get('mem')||999)){set('mem',m);$('#mb').textContent=m}snd('win');earn(Math.max(5,30-m));setTimeout(()=>alert('Venceu em '+m+' jogadas! 🎉'),200)}}
      else{snd('bad');lock=true;const x=a;a=null;setTimeout(()=>{x.classList.remove('f');k.classList.remove('f');x.textContent=k.textContent='';lock=false},700)}};$('#mg').appendChild(k)})};
  $('#mr').onclick=init;init();return()=>{}
}

/* ========== Reflexo ========== */
function refl(){
  let st='i',t0,to;const b=$('#rxb'),sh=(t,col)=>{b.textContent=t;b.style.background=col};$('#rb').textContent=get('rx')?get('rx')+' ms':'–';
  b.onclick=()=>{if(st==='i'){st='w';sh('Espere ficar verde…','#c92a2a');to=setTimeout(()=>{st='g';snd('ok');t0=performance.now();sh('AGORA!','#2b8a3e')},1000+Math.random()*3000)}
    else if(st==='w'){clearTimeout(to);st='i';sh('Cedo demais! Toque para tentar de novo','#495057')}
    else{const t=Math.round(performance.now()-t0);st='i';$('#rl').textContent=t+' ms';if(t<(+get('rx')||9999)){set('rx',t);$('#rb').textContent=t+' ms'}sh(t+' ms! Toque para repetir','#495057')}};
  return()=>clearTimeout(to)
}

/* ========== Pedra, papel e tesoura ========== */
function ppt(){
